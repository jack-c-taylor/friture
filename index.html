<!doctype html>
<html>
  <head>
    <script src="//cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.min.js"></script>
    <script src="./main.js"></script>
    <style>
      #game-container {
        display: flex;
        flex-direction: column;
        align-items: middle;
        width: 1000px;
      }

      #photo-output, #photo-link {
        display: none;
        width: 1000px;
        height: 750px;
      }

      #screenshot {
        color: white;
        background-color: darkblue;
        border-radius: 0.5rem;
        padding: 0.5rem;
        align-self: center;
      }

      #imageInput {
        display: none;
      }
    </style>
  </head>
  <body>
    <a id="photo-link" href="#" download="friture"></a>
    <input type="file" id="imageInput" accept="image/*" />
    <canvas id="photo-output" width="1000" height="750"></canvas>
    <div id="game-container">
      <div id="friture-game"></div>
    </div>
  </body>
</html>
