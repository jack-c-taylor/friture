<!doctype html>
<html>
  <head>
    <script src="//cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.min.js"></script>
    <script src="./main.js"></script>
    <style>
      body {
        background-color: cadetblue;
        display: flex;
      }

      #game-container {
        display: flex;
        flex-direction: column;
        align-items: middle;
        width: 1000px;
      }

      #photo-output,
      #photo-link {
        display: none;
        width: 1000px;
        height: 750px;
      }

      #screenshot {
        color: white;
        background-color: darkblue;
        border-radius: 0.5rem;
        padding: 0.5rem;
        align-self: center;
      }

      #imageInput {
        display: none;
      }

      #tooltip {
        background-color: white;
        margin-left: 20px;
        padding: 20px;
        height: fit-content;
        font-family: sans-serif;
        float: right;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <a id="photo-link" href="#" download="friture"></a>
    <input type="file" id="imageInput" accept="image/*" />
    <canvas id="photo-output" width="1000" height="750"></canvas>
    <div id="game-container">
      <div id="friture-game"></div>
    </div>
    <div id="tooltip">
      <p>Line tool - four colour ranges, move slowly for detailed work.</p>
      <p>Fire tool - alternating pattern.</p>
      <p>Leaf tool - alternating pattern and rotation.</p>
      <p>Frame tool - including two custom frames!</p>
      <p>Upload tool - resizes uploaded image to fit canvas.</p>
    </div>
  </body>
</html>
